name: Crypto Daily Sync

on:
  schedule:
    # Every day at 1 AM UTC
    - cron: "0 1 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Trigger daily crypto sync
        run: |
          echo "🔄 Syncing crypto data..."
          echo "⏰ Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/internal/sync-daily" \
            -H "Authorization: Bearer ${INTERNAL_SYNC_SECRET}" \
            -H "Content-Type: application/json")

          cat /tmp/body.json
          echo ""
          echo "📊 Response code: HTTP $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "❌ Daily sync failed."
            exit 1
          fi

          echo "✅ Daily crypto sync successful."
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}

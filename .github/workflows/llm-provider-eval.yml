name: LLM Provider Evaluation

on:
  workflow_dispatch:
    inputs:
      analyst_provider:
        description: "Crypto Analyst provider under test (production analyzeCryptoQuery)"
        required: true
        default: claude
        type: choice
        options:
          - claude
          - openai
          - gemini
          - groq
          - deepseek
          - openrouter
      judge_provider:
        description: "Independent semantic judge provider"
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - claude
          - openai
          - gemini
          - groq
          - deepseek
      judge_model:
        description: "Optional judge model override (LLM_EVAL_JUDGE_MODEL)"
        required: false
        type: string

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  live-benchmark:
    name: Live provider benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Optional evaluation. Never used as a required deployment check.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live provider benchmark
        env:
          CRYPTO_ANALYST_EVAL_PROVIDER: ${{ github.event.inputs.analyst_provider || 'claude' }}
          LLM_EVAL_JUDGE_PROVIDER: ${{ github.event.inputs.judge_provider || 'openrouter' }}
          INPUT_JUDGE_MODEL: ${{ github.event.inputs.judge_model }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "analystProvider=$CRYPTO_ANALYST_EVAL_PROVIDER"
          echo "judgeProvider=$LLM_EVAL_JUDGE_PROVIDER"
          echo "dataset=semantic-grounding-live-v1"
          echo "productionPath=analyzeCryptoQuery"
          if [ -n "$INPUT_JUDGE_MODEL" ]; then
            export LLM_EVAL_JUDGE_MODEL="$INPUT_JUDGE_MODEL"
          elif [ "$LLM_EVAL_JUDGE_PROVIDER" = "openrouter" ]; then
            export LLM_EVAL_JUDGE_MODEL="nvidia/nemotron-3-super-120b-a12b:free"
          fi
          npm run test:llm:live-grounding

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-benchmark
          path: |
            evals/.output/live-grounding-latest.json
            evals/.output/live-grounding-summary.json
          if-no-files-found: warn

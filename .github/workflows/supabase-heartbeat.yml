name: Supabase Heartbeat

on:
  schedule:
    # Every day at 09:00 UTC
    - cron: "0 9 * * *"

  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Keep Supabase project active
        run: |
          echo "🔍 Pinging Supabase to prevent inactivity suspension..."
          echo "⏰ Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          response=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/test_runs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}")

          echo "📊 Supabase response: HTTP $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "❌ Heartbeat failed - project may face inactivity suspension."
            exit 1
          fi

          echo "✅ Heartbeat successful - project remains active."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
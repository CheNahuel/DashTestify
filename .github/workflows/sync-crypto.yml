name: Sync Crypto Data

on:
  schedule:
    # Intraday sync: every 5 minutes
    - cron: '*/5 * * * *'
    # Daily sync: 1 AM UTC
    - cron: '0 1 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync-intraday:
    runs-on: ubuntu-latest
    # Run intraday on 5-minute schedule
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call sync-intraday Edge Function
        run: |
          curl -X POST https://kayzrduiqcxvwwjftttk.supabase.co/functions/v1/sync-intraday \
            -H "Content-Type: application/json" \
            -d '{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
        continue-on-error: true

  sync-daily:
    runs-on: ubuntu-latest
    # Run daily at 1 AM UTC
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call sync-daily Edge Function
        run: |
          curl -X POST https://kayzrduiqcxvwwjftttk.supabase.co/functions/v1/sync-daily \
            -H "Content-Type: application/json" \
            -d '{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
        continue-on-error: true
